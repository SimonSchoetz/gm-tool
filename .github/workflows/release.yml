name: Release

# `draft` verifies the tag and creates the draft release (or finds it again on a re-run); `checks` and `build` then run side by side, and `publish` makes the release public only when both passed. The updater reads `releases/latest/download/latest.json`, which serves only the latest published release, so until `publish` runs a release is invisible to installed apps. A failed check or build skips `publish` and leaves the draft; re-running the failed jobs completes the same draft.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.draft.outputs.release-id }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor ${{ github.sha }} origin/main || (echo "Release tags must be pushed from main" && exit 1)

      # The releases list includes drafts and a lookup by tag does not, so the list is searched; the three matrix builds then upload to this one release instead of each creating a draft of their own. A release of this tag that is already published fails the run: the builds would replace assets, `latest.json` among them, that installed apps are already served.
      - name: Find or create the draft release
        id: draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          release=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq -r --arg tag "$TAG" '.[] | select(.tag_name == $tag) | "\(.id) \(.draft)"' | sed -n '1p')
          if [ -z "$release" ]; then
            release_id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$TAG" -f name="GM Tool $TAG" -F draft=true -F prerelease=false --jq .id)
          else
            release_id=${release% *}
            if [ "${release#* }" != "true" ]; then
              echo "The release for $TAG is already published and is not rebuilt in place."
              exit 1
            fi
          fi
          echo "release-id=$release_id" >> "$GITHUB_OUTPUT"

  # [DEFERRED-VIOLATION: CLAUDE.md Tool Use Discipline, "The `check` job in `.github/workflows/release.yml` runs every row" — the `build` job needs only `draft` and `publish` needs `checks`, and the check steps live in checks.yml]
  checks:
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml

  build:
    needs: draft
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      release-id: ${{ needs.draft.outputs.release-id }}
      tag-name: ${{ github.ref_name }}
    # The one place the signing key reaches a build.
    secrets: inherit

  # Skipped when `checks` or `build` fails, which leaves the draft in place.
  publish:
    needs: [draft, checks, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      RELEASE_ID: ${{ needs.draft.outputs.release-id }}
    steps:
      - name: Fetch the draft's assets
        run: gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" > assets.json

      # The nine assets of v0.17.0, each matched by its suffix: three installers, two updater archives, their three signatures and `latest.json`. Any other set fails.
      - name: Verify the asset set
        run: |
          expected='["_aarch64.dmg","_x64.dmg","_x64-setup.exe","_x64-setup.exe.sig","GM-Tool_aarch64.app.tar.gz","GM-Tool_aarch64.app.tar.gz.sig","GM-Tool_x64.app.tar.gz","GM-Tool_x64.app.tar.gz.sig","latest.json"]'
          if ! jq -e --argjson expected "$expected" '
            [.[].name] as $names
            | all($names[]; . as $n | [$expected[] | select(. as $s | $n | endswith($s))] | length == 1)
            and all($expected[]; . as $s | [$names[] | select(endswith($s))] | length == 1)
          ' assets.json > /dev/null; then
            echo "The draft's assets are not the expected set:"
            jq -r '.[].name' assets.json
            exit 1
          fi

      - name: Download latest.json
        run: |
          asset_id=$(jq -r '.[] | select(.name == "latest.json") | .id' assets.json)
          gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > latest.json

      # The three build jobs each merge their own platform into `latest.json`; two finishing together can overwrite each other's platform, so this step fails the run when one is missing. Re-running the build job of the missing platform merges it again.
      - name: Verify latest.json
        run: |
          if ! jq -e --arg version "${TAG#v}" --arg tag "$TAG" '
            .version == $version
            and ((.platforms | keys | sort) == ["darwin-aarch64","darwin-aarch64-app","darwin-x86_64","darwin-x86_64-app","windows-x86_64","windows-x86_64-nsis"])
            and all(.platforms[]; (.url | contains("/download/" + $tag + "/")) and (.signature | length > 0))
          ' latest.json > /dev/null; then
            echo "latest.json does not describe $TAG for all six platforms:"
            cat latest.json
            exit 1
          fi

      - name: Publish the release
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -f make_latest=true
