name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  # Pinned rather than floating on node@lts, which tracks whichever line is Active LTS at build time and so can move CI across a major without a commit. Keep in step with `.nvmrc` at the repository root. jsdom requires 24.15.0 or newer, the floor `engines.node` in app/package.json states.
  NODE_RUNTIME: node@24

jobs:
  # Runs every row of the Check Commands table in the root CLAUDE.md except `mutation-check`, which finds no changed file to mutate on a tag that sits on main, before any release build, so a release never ships code those checks reject, even when a git hook was bypassed. Step names are the table's keys; keep the steps in step with the table.
  check:
    permissions:
      contents: read
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor ${{ github.sha }} origin/main || (echo "Release tags must be pushed from main" && exit 1)

      # No run for a different tag can restore a cache saved under this one, and no workflow runs on main, whose caches every tag could restore, so the pnpm and cargo caches below can help only a later run under the same tag.
      - uses: pnpm/setup@v2
        with:
          package-json-file: app/package.json
          runtime: ${{ env.NODE_RUNTIME }}
          install: false
          cache: true
          cache-dependency-path: app/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
          # Saved when a check fails too, so a failed check still leaves a cache for a later run under the same tag.
          cache-on-failure: true

      - name: Install frontend dependencies
        run: pnpm install

      - name: type-check
        run: npx tsc --noEmit

      - name: lint
        run: npx eslint .

      - name: format-check
        run: npx prettier --check .

      - name: Install root dependencies
        run: pnpm install
        working-directory: .

      - name: markdown-lint
        run: pnpm run markdown-lint
        working-directory: .

      - name: test
        run: npx vitest run

      - name: rust-lint
        run: cargo clippy --all-targets -- -D warnings
        working-directory: app/src-tauri

      - name: rust-format-check
        run: cargo fmt --check
        working-directory: app/src-tauri

      - name: rust-test
        run: cargo test
        working-directory: app/src-tauri

  release:
    needs: check
    permissions:
      contents: write
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
          - os: macos-latest
            args: '--target aarch64-apple-darwin'
          - os: macos-latest
            args: '--target x86_64-apple-darwin'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/setup@v2
        with:
          package-json-file: app/package.json
          runtime: ${{ env.NODE_RUNTIME }}
          install: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && matrix.args == '--target aarch64-apple-darwin' && 'aarch64-apple-darwin' || matrix.os == 'macos-latest' && 'x86_64-apple-darwin' || '' }}

      - name: Install frontend dependencies
        run: pnpm install
        working-directory: app

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: GM Tool ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          projectPath: app
          args: ${{ matrix.args }}
