name: Checks

# Runs every row of the Check Commands table in the root CLAUDE.md except `mutation-check`, whatever the row's Trigger, with one exception: on a pull request that changes only `.md` files, only `static` runs, since `format-check` and `markdown-lint` are the only rows that read a Markdown file. Inside a workflow called with `workflow_call`, the `github` context is the caller's, so pushes to `main`, the schedule and release.yml always run every job. `mutation-check` mutates only files changed against `main`, so it has nothing to do on a push to `main` or on a tag, and it stays a local gate before review. ci.yml calls this workflow for pull requests, pushes to `main` and the schedule; release.yml calls it and publishes only when it passes, so a release never ships code these checks reject, even when a git hook was bypassed. Step names are the table's keys; keep the steps in step with the table. The rows run in five parallel jobs, all but `static` after the few seconds of `changes`, so a run takes about as long as its slowest job: `static`, `lint` and `test-app` on Linux, since none of their rows depends on the platform, with `lint`, the longest of the static rows, in a job of its own; `test-node-tooling` on macOS, since the dev data server's tests exercise its macOS-only app-data paths; `rust` on macOS, the platform the Tauri crate is linted and tested on.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  # A pull request's merge commit has the base branch as its first parent, so the diff between the two is what the pull request would change; `--no-renames` lists both names of a renamed file. Any other event sets no `docs-only`.
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.diff.outputs.docs-only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2

      - name: List changed files
        id: diff
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          changed=$(git diff --name-only --no-renames HEAD^1 HEAD)
          echo "$changed"
          if [ -n "$changed" ] && ! grep -qv '\.md$' <<< "$changed"; then
            echo "docs-only=true" >> "$GITHUB_OUTPUT"
          fi

  static:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-pnpm

      - name: Install frontend dependencies
        run: pnpm install

      # Before the type-check: `scripts/tsconfig.json` takes its Node types from the repository root's `@types/node`.
      - name: Install root dependencies
        run: pnpm install
        working-directory: .

      - name: type-check
        run: npx tsc --noEmit && npx tsc --noEmit -p ../scripts

      - name: format-check
        run: npx prettier --check . ../scripts

      - name: markdown-lint
        run: pnpm run markdown-lint
        working-directory: .

      - name: css-token-check
        run: node scripts/css-token-check.ts
        working-directory: .

  test-app:
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-pnpm

      - name: Install frontend dependencies
        run: pnpm install

      - name: test-app
        run: npx vitest run --project app

  test-node-tooling:
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-pnpm

      - name: Install frontend dependencies
        run: pnpm install

      # The tests of the repository-root `scripts/` run in this project, beside the root's dependencies.
      - name: Install root dependencies
        run: pnpm install
        working-directory: .

      - name: test-node-tooling
        run: npx vitest run --project node-tooling

  rust:
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      # Saved on `main` only: a pull request's caches are scoped to its merge ref and a tag run's cannot serve another tag, so saving from either only crowds out the caches of `main`, which every run can restore, within the repository's 10 GB. Saved when a check fails too, so a failed check still leaves a cache for the next run.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app/src-tauri -> target
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: rust-lint
        run: cargo clippy --all-targets -- -D warnings

      - name: rust-format-check
        run: cargo fmt --check

      - name: rust-test
        run: cargo test

  lint:
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-pnpm

      - name: Install frontend dependencies
        run: pnpm install

      # As in `static`: `scripts/tsconfig.json` takes its Node types from the repository root's `@types/node`.
      - name: Install root dependencies
        run: pnpm install
        working-directory: .

      - name: lint
        run: npx eslint --concurrency=auto . ../scripts
