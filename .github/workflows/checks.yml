name: Checks

# Runs every row of the Check Commands table in the root CLAUDE.md except `mutation-check`, whatever the row's Trigger. `mutation-check` mutates only files changed against `main`, so it has nothing to do on a push to `main` or on a tag, and it stays a local gate before review. ci.yml calls this workflow for pull requests, pushes to `main` and the schedule; release.yml calls it and publishes only when it passes, so a release never ships code these checks reject, even when a git hook was bypassed. Step names are the table's keys; keep the steps in step with the table. The rows run in three parallel jobs, so a run takes as long as its slowest job: `static` on Linux, since none of its rows depends on the platform; `test` on macOS, since the dev data server's tests exercise its macOS-only app-data paths; `rust` on macOS, the platform the Tauri crate is linted and tested on.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: ./.github/actions/setup-pnpm

      - name: Install frontend dependencies
        run: pnpm install

      # Before the type-check: `scripts/tsconfig.json` takes its Node types from the repository root's `@types/node`.
      - name: Install root dependencies
        run: pnpm install
        working-directory: .

      - name: type-check
        run: npx tsc --noEmit && npx tsc --noEmit -p ../scripts

      - name: lint
        run: npx eslint . ../scripts

      - name: format-check
        run: npx prettier --check . ../scripts

      - name: markdown-lint
        run: pnpm run markdown-lint
        working-directory: .

      - name: css-token-check
        run: node scripts/css-token-check.ts
        working-directory: .

  test:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: ./.github/actions/setup-pnpm

      - name: Install frontend dependencies
        run: pnpm install

      # The tests of the repository-root `scripts/` run in this suite too, beside the root's dependencies.
      - name: Install root dependencies
        run: pnpm install
        working-directory: .

      - name: test
        run: npx vitest run

  rust:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      # Saved on `main` only: a pull request's caches are scoped to its merge ref and a tag run's cannot serve another tag, so saving from either only crowds out the caches of `main`, which every run can restore, within the repository's 10 GB. Saved when a check fails too, so a failed check still leaves a cache for the next run.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app/src-tauri -> target
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: rust-lint
        run: cargo clippy --all-targets -- -D warnings

      - name: rust-format-check
        run: cargo fmt --check

      - name: rust-test
        run: cargo test
