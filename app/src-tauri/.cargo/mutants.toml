# cargo-mutants configuration for `pnpm run mutation-check` (scripts/mutation-check-rust.ts).
# The networking glue `app/src-tauri/CLAUDE.md` — Testing exempts from unit tests is left out: no test observes it, so a missed mutant there is no gap to close. `pairing.rs` also holds unit-tested logic (`evaluate_code_submit`, `evaluate_code_verdict`) and `mod.rs` holds none of the glue, so those two files stay in scope and only the glue functions of `pairing.rs` are excluded by name.
exclude_globs = [
  "src/commands/connectivity/**",
  "src/connectivity/connections.rs",
  "src/connectivity/identity.rs",
]
# Matched against each mutant's full name (file, line, function, change); the functions are the I/O of `pairing.rs`: the four `pub` entry points called by `commands/connectivity/`, the probing and connection loops, and the two helpers that write to the stream or the shared state.
exclude_re = [
  '^src/connectivity/pairing\.rs:\d+:\d+: .*\b(enter_pairing_mode|exit_pairing_mode|submit_pairing_code|request_pairing_code|maybe_probe_candidate|run_pairing_connection|send_verdict|remove_probe)\b',
]
