# Its presence stops pnpm from treating the root pnpm-workspace.yaml (one directory up) as this project's workspace root; without it, `pnpm install` here silently no-ops against the wrong lockfile.
allowBuilds:
  # The postinstall only downloads a native binding when pnpm failed to install the platform's optional binding package, so it has nothing to do here.
  unrs-resolver: false
# Pinned rather than inherited: pnpm applies a 1440-minute (24-hour) minimum release age by default, which is what keeps a freshly published version out of the lockfile until malicious releases have had time to be caught and pulled. Stating it here keeps the policy in force if that default ever changes, and makes it visible to anyone reading this file. Raising it delays legitimate upstream fixes by the same amount.
minimumReleaseAge: 1440
overrides:
  # No minimatch 10.x release fixes the globparts DoS (GHSA-g3hv-75wg-m249, fixed in 11.0.1), and two parents still cap it at 10: Stryker 10.1.1 (its latest) pins ~10.2.4, and @typescript-eslint/typescript-estree 8.70.0, which stays installed under the @typescript-eslint/utils peer of eslint-plugin-import-x, asks for ^10.2.2. Both call only APIs that 11 kept: `minimatch()` and `new Minimatch()` with `dot`, `nocase` and `flipNegate`, `.match()`, `.negate` and `.hasMagic()`; 11 removed `makeRe()`, the `AST` class and `matchOne()`. Drop an entry once no installed version of that parent asks for a range below 11.
  '@stryker-mutator/core>minimatch': ^11.0.1
  '@typescript-eslint/typescript-estree>minimatch': ^11.0.1
  # typed-rest-client 2.3.1 pins qs to exactly 6.15.1, and Stryker 10.1.1 (its latest) pins typed-rest-client ~2.3.0. qs 6.16.1 fixes the `stringify` DoS of GHSA-q8mj-m7cp-5q26 and GHSA-6pq8-jhm2-2vcw. The jump stays within qs 6.x, whose 6.16 and 6.17 releases list only fixes and additions; typed-rest-client calls only `qs.stringify` with `addQueryPrefix`, `delimiter`, `allowDots`, `arrayFormat` and `encodeValuesOnly`. Drop this entry once Stryker's typed-rest-client range reaches 3.x, whose qs range is ^6.16.1.
  'typed-rest-client>qs': ^6.16.1
